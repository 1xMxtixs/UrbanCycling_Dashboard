version: '3.8'

services:
  mysql_db:
    image: mariadb:lts 
    container_name: urbancycling_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_cycling_pass
      MYSQL_DATABASE: urbancycling_db
      MYSQL_USER: cycling_admin
      MYSQL_PASSWORD: cycling_secure_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: